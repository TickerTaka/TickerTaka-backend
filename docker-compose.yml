# Local development only.
# Production: PostgreSQL is on NCP managed DB; Redis and ChromaDB are
# self-hosted on a separate NCP server via Docker (auth + persistence
# enabled). See memo/plans/debate-runtime-infrastructure-plan.md and
# memo/plans/vector-db-and-evidence-retrieval-plan.md for production
# compose examples.

services:
  postgres:
    profiles: ["local-db"]
    image: postgres:15-alpine
    container_name: tickertaka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tickertaka
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d tickertaka"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: tickertaka-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  chroma:
    image: chromadb/chroma:0.5.23
    container_name: tickertaka-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ALLOW_RESET: "TRUE"
      PERSIST_DIRECTORY: "/chroma/chroma"
      ANONYMIZED_TELEMETRY: "FALSE"
      CHROMA_TELEMETRY_ENABLED: "FALSE"
    ports:
      - "8080:8000"
    volumes:
      - chromadata:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tickertaka-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CHROMA_URL: http://chroma:8000
      NOTION_MCP_SERVER_COMMAND: ""
      NOTION_MCP_SERVER_ARGS: ""
      HF_HOME: /root/.cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      - hfcache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Qwen(sLLM) 비동기 보강 워커. app 이미지를 그대로 재사용하고 command 만 교체한다.
  # analysis_jobs 큐를 폴링해 Qwen 구조화 분석 + 하네스 + Langfuse trace 를 수행한다.
  # 이 서비스가 없으면 watchlist 추가 시 baseline(FinBERT)까지만 저장되고 보강은 안 된다.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tickertaka-worker
    restart: unless-stopped
    command: python -m app.workers.analysis_worker
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CHROMA_URL: http://chroma:8000
      HF_HOME: /root/.cache/huggingface
    volumes:
      - hfcache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy

  # ── Ollama 원격 서빙 ────────────────────────────────────────
  # 감성분석 Qwen sLLM을 transformers 인-프로세스 대신 OpenAI 호환 원격 서빙으로
  # 돌리고 싶을 때 사용. 기본 비활성(profile)이라 일반 `up`에선 뜨지 않는다.
  #
  # 원커맨드 기동 (서버 + 모델 자동 pull):
  #   docker compose --profile ollama up -d
  #
  # .env 전환 (호스트 직접 실행 시):
  #   ANALYSIS_GENERATION_BACKEND=remote
  #   ANALYSIS_GENERATION_BASE_URL=http://localhost:11434/v1
  #   ANALYSIS_GENERATION_MODEL=qwen2.5:3b
  #
  # .env 전환 (Docker Compose 내부 서비스 간):
  #   ANALYSIS_GENERATION_BASE_URL=http://ollama:11434/v1
  #
  # vLLM 전환 시 URL만 교체 (코드 변경 없음, OpenAI 호환):
  #   ANALYSIS_GENERATION_BASE_URL=http://<vllm-host>:8000/v1
  #   ANALYSIS_GENERATION_MODEL=Qwen/Qwen2.5-3B-Instruct
  #   ANALYSIS_GENERATION_API_KEY=<vllm-api-key>
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: tickertaka-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Ollama 모델 자동 pull. ollama 서비스가 healthy 된 후 qwen2.5:3b 를 pull 한다.
  # 이미 존재하면 즉시 완료(no-op). 별도 docker exec 없이 원커맨드로 끝난다.
  ollama-init:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: tickertaka-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["ollama", "pull", "qwen2.5:3b"]
    restart: "no"

volumes:
  pgdata:
  chromadata:
  hfcache:
  ollamadata:
