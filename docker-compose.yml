# Local development only.
# Production: PostgreSQL is on NCP managed DB; Redis and ChromaDB are
# self-hosted on a separate NCP server via Docker (auth + persistence
# enabled). See memo/plans/debate-runtime-infrastructure-plan.md and
# memo/plans/vector-db-and-evidence-retrieval-plan.md for production
# compose examples.

services:
  postgres:
    image: postgres:15-alpine
    container_name: tickertaka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tickertaka
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d tickertaka"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: tickertaka-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  chroma:
    image: chromadb/chroma:0.5.23
    container_name: tickertaka-chroma
    restart: unless-stopped
    command: ["--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    volumes:
      - chromadata:/chroma/chroma

volumes:
  pgdata:
  chromadata:
