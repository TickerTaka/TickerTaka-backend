# Local development only.
# Production: PostgreSQL is on NCP managed DB; Redis and ChromaDB are
# self-hosted on a separate NCP server via Docker (auth + persistence
# enabled). See memo/plans/debate-runtime-infrastructure-plan.md and
# memo/plans/vector-db-and-evidence-retrieval-plan.md for production
# compose examples.

services:
  postgres:
    profiles: ["local-db"]
    image: postgres:15-alpine
    container_name: tickertaka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tickertaka
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d tickertaka"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: tickertaka-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  chroma:
    image: chromadb/chroma:0.5.23
    container_name: tickertaka-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ALLOW_RESET: "TRUE"
      PERSIST_DIRECTORY: "/chroma/chroma"
      ANONYMIZED_TELEMETRY: "FALSE"
      CHROMA_TELEMETRY_ENABLED: "FALSE"
    ports:
      - "8080:8000"
    volumes:
      - chromadata:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tickertaka-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CHROMA_URL: http://chroma:8000
      NOTION_MCP_SERVER_COMMAND: ""
      NOTION_MCP_SERVER_ARGS: ""
      HF_HOME: /root/.cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      - hfcache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  chromadata:
  hfcache:
